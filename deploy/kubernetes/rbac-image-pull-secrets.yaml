# OPTIONAL. Apply only together with --kubernetes-image-pull-secrets=true.
#
# It lets the exporter read Secrets in every namespace so that it can use
# the imagePullSecrets of the discovered pods. RBAC cannot restrict "get"
# to Secrets of type kubernetes.io/dockerconfigjson, so this grants read
# access to ALL Secrets. Prefer workload identity (IRSA, GKE Workload
# Identity, Azure Workload Identity) or a dedicated DOCKER_CONFIG Secret
# mounted into the exporter. To limit the exposure, replace this
# ClusterRoleBinding with RoleBindings in selected namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: container-image-exporter-pull-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: container-image-exporter-pull-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: container-image-exporter-pull-secrets
subjects:
  - kind: ServiceAccount
    name: container-image-exporter
    namespace: monitoring
